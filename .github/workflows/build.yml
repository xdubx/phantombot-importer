name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/phantombot-importer.exe .
      - run: GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/phantombot-importer-linux .
      - uses: actions/upload-artifact@v4
        with:
          name: phantombot-importer
          path: dist/*
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
